[project]
name = "rk3588"
version = "0.1.0"
description = "PPE detection research & training pipeline for RK3588 NPU deployment"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.4.0",
    "numpy<=1.26.4",
    "setuptools<82",
    "ultralytics>=8.3",
    "pyyaml>=6.0",
    "rknn-toolkit2==2.3.2",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124" },
]
rknn-toolkit2 = { path = "3rdparty/rknn-toolkit2/rknn-toolkit2/packages/x86_64/rknn_toolkit2-2.3.2-cp312-cp312-manylinux_2_17_x86_64.manylinux2014_x86_64.whl" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
