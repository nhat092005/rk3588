# uv workspace of the meta-repo: one .venv and one uv.lock for common and ai. Run `make sync`.
[project]
name = "rk3588"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff==0.17.5",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.workspace]
members = ["common", "ai"]

# Sources here apply to every member.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu124" },
]
rknn-toolkit2 = { path = "3rdparty/rknn-toolkit2/rknn-toolkit2/packages/x86_64/rknn_toolkit2-2.3.2-cp312-cp312-manylinux_2_17_x86_64.manylinux2014_x86_64.whl" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
