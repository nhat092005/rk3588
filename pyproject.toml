[project]
name = "rk3588"
version = "0.1.0"
description = "PPE detection research & training pipeline for RK3588 NPU deployment"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5",
    "ultralytics>=8.3",
    "pyyaml>=6.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
